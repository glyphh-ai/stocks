services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: stocks-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocks
      POSTGRES_PASSWORD: stocks
      POSTGRES_DB: stocks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks -d stocks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
